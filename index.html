<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Situation · Les glucides — Que ferais-tu ?</title>
<style>:root{--cream:#f4e6c7;--paper:#fff8e9;--gold:#e7ad43;--wine:#5b2b2c;--ink:#352724;--green:#4f7b58;--red:#a54b43}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Georgia,"Times New Roman",serif;min-height:100vh}.wrap{max-width:780px;margin:auto;padding:18px 14px 34px}.brand{text-align:center;color:var(--wine);font-size:clamp(26px,7vw,42px);font-weight:700;margin:3px 0 14px}.card{background:var(--paper);border:2px solid var(--wine);border-radius:12px;overflow:hidden;box-shadow:0 4px 0 rgba(91,43,44,.12)}.head{background:var(--gold);border-bottom:2px solid var(--wine);padding:10px 16px}.head b{display:block;font-size:25px}.head em{font-size:15px}.question{padding:18px 18px 8px;text-align:center;font-size:clamp(20px,5vw,28px);line-height:1.3}.hint{text-align:center;margin:0 12px 16px;font-family:Arial,sans-serif;font-size:15px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 14px 18px}.food{appearance:none;background:#fffdf7;border:2px solid #b99d7a;border-radius:13px;padding:12px 7px;min-height:142px;font:700 18px Georgia,serif;color:var(--ink);cursor:pointer}.food .emoji{display:block;font-size:62px;line-height:1.1;margin-bottom:7px}.food.selected{border:4px solid var(--wine);background:#f8e2ad;padding:10px 5px;transform:translateY(-1px)}.actions{padding:0 14px 14px}.validate{width:100%;border:0;border-radius:10px;padding:15px;font:bold 19px Arial,sans-serif;cursor:pointer;background:var(--wine);color:white}.result{display:none;margin:0 14px 16px;padding:14px;border-radius:10px;text-align:center;font:700 18px Arial,sans-serif}.result.ok{display:block;background:#e2f0e2;color:#285934;border:2px solid var(--green)}.result.no{display:block;background:#f7e0d9;color:#7a332e;border:2px solid var(--red)}.foot{border-top:1px dashed #9d8069;padding:12px 16px 14px;font-style:italic;font-size:15px}@media(max-width:390px){.food{min-height:126px}.food .emoji{font-size:52px}}</style></head>
<body><main class="wrap"><div class="brand">Que ferais-tu&nbsp;?</div><section class="card"><header class="head"><b>Situation</b><em>Petits 5–8 ans</em></header><div class="question">Tu as devant toi une pomme, du pain, du fromage et du riz.<br><strong>Lesquels contiennent des glucides&nbsp;?</strong></div><p class="hint">Touche les aliments que tu choisis, puis valide ta réponse.</p><div class="grid"><button class="food" data-id="pomme"><span class="emoji">🍎</span>Pomme</button><button class="food" data-id="pain"><span class="emoji">🥖</span>Pain</button><button class="food" data-id="fromage"><span class="emoji">🧀</span>Fromage</button><button class="food" data-id="riz"><span class="emoji">🍚</span>Riz</button></div><div class="actions"><button class="validate" id="validate">Valider ma réponse</button></div><div class="result" id="result" role="status"></div><div class="foot">Compétence 1 · Les glucides</div></section></main>
<script>const selected=new Set();document.querySelectorAll('.food').forEach(b=>b.onclick=()=>{const id=b.dataset.id;if(selected.has(id)){selected.delete(id);b.classList.remove('selected')}else{selected.add(id);b.classList.add('selected')}const r=document.getElementById('result');r.className='result';r.textContent=''});document.getElementById('validate').onclick=()=>{const r=document.getElementById('result'),c=['pomme','pain','riz'],ok=selected.size===3&&c.every(x=>selected.has(x));if(ok){r.className='result ok';r.innerHTML='Bravo&nbsp;! 🎉<br>La pomme, le pain et le riz contiennent des glucides.'}else if(!selected.size){r.className='result no';r.textContent='Choisis au moins un aliment avant de valider 🙂'}else{r.className='result no';r.innerHTML='Pas tout à fait. Regarde bien les 4 aliments et réessaie&nbsp;! 💡'};r.scrollIntoView({behavior:'smooth',block:'nearest'})}</script></body></html>
