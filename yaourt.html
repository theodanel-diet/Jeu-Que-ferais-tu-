<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Que ferais-tu ? - Emballage de yaourt</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f4e6c7;
      color: #352724;
      font-family: Georgia, serif;
      text-align: center;
    }

    .titre {
      color: #5b2b2c;
      font-size: 30px;
      margin: 10px 0 20px;
    }

    .carte {
      max-width: 850px;
      margin: auto;
      background: #fff8e9;
      border: 3px solid #5b2b2c;
      border-radius: 22px;
      padding: 18px;
      box-sizing: border-box;
    }

    .bandeau {
      display: inline-block;
      background: #e7ad43;
      color: #5b2b2c;
      font-weight: bold;
      padding: 8px 18px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    h2 {
      margin: 8px 0;
      color: #5b2b2c;
    }

    p {
      font-size: 18px;
      line-height: 1.4;
    }

    .yaourt {
      width: 100%;
      max-width: 760px;
      height: auto;
      margin-top: 10px;
      border-radius: 14px;
    }

    .aide {
      margin-top: 14px;
      font-size: 15px;
      font-style: italic;
    }
  </style>
</head>

<body>

  <div class="titre">Que ferais-tu ?</div>

  <div class="carte">

    <div class="bandeau">Situation · Petits 5–8 ans</div>

    <h2>Observe l'emballage du yaourt</h2>

    <p>
      Ton adulte lit l'emballage d'un yaourt.<br>
      <strong>Quel chiffre cherche-t-on pour connaître les glucides ?</strong>
    </p>

    <img
      class="yaourt"
      src="yaourt.png"
      alt="Emballage d'un yaourt avec son tableau nutritionnel"
    >

    <div class="aide">
      Tu peux agrandir l'image avec tes doigts 🔍
    </div>

  </div>

</body>
</html>
