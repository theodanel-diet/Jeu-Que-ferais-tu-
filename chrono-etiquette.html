<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chrono étiquette</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;
  background: #f4e6c7;
  color: #352724;
  font-family: Georgia, "Times New Roman", serif;
  text-align: center;
}

.game {
  max-width: 720px;
  margin: auto;
}

h1 {
  color: #5b2b2c;
  margin: 6px 0 12px;
  font-size: 30px;
}

.intro {
  line-height: 1.5;
  margin-bottom: 14px;
}

.timer {
  display: inline-block;
  background: #5b2b2c;
  color: white;
  font-size: 27px;
  font-weight: bold;
  padding: 9px 18px;
  border-radius: 14px;
  margin: 8px 0 14px;
}

.mission {
  background: #fff8e9;
  border: 2px solid #e7ad43;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 14px;
  font-weight: bold;
  line-height: 1.6;
}

.image-wrap {
  position: relative;
  width: 100%;
  max-width: 620px;
  margin: auto;
}

.image-wrap img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 12px;
}

/* Zones tactiles totalement invisibles */

.target {
  position: absolute;
  cursor: pointer;
  background: transparent;
  border: none;
  outline: none;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

/* Glucides pour 100 g */
#carbs100 {
  left: 49%;
  top: 48%;
  width: 11%;
  height: 5%;
}

/* Glucides par portion */
#carbsPortion {
  left: 60%;
  top: 48%;
  width: 12%;
  height: 5%;
}

/* Liste des ingrédients */
#ingredients {
  left: 74%;
  top: 35%;
  width: 22%;
  height: 22%;
}

.feedback {
  min-height: 32px;
  margin-top: 12px;
  font-weight: bold;
  line-height: 1.4;
}

.correct {
  color: #4f7b58;
}

button.control {
  border: none;
  border-radius: 12px;
  padding: 13px 22px;
  margin: 12px 5px 5px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

#start {
  background: #5b2b2c;
  color: white;
}

#replay {
  background: #e7ad43;
  color: #352724;
  display: none;
}

#result {
  display: none;
  margin-top: 16px;
  padding: 15px;
  border-radius: 14px;
  font-weight: bold;
  line-height: 1.6;
}

.success {
  display: block !important;
  background: #dcebdc;
  color: #35543c;
}

.fail {
  display: block !important;
  background: #f2d8d5;
  color: #7b3732;
}
</style>
</head>

<body>

<div class="game">

<h1>⏱️ Chrono étiquette</h1>

<p class="intro">
Observe bien l'emballage puis lance le chrono quand tu es prêt !
</p>

<div class="timer" id="timer">30 s</div>

<div class="mission" id="mission">
<strong>À retrouver en 30 secondes :</strong><br><br>
Glucides pour 100 g<br>
Glucides par portion<br>
Liste des ingrédients
</div>

<div class="image-wrap">

  <img
    src="emballage-cereales.png"
    alt="Dos d'un paquet de céréales avec tableau nutritionnel et liste des ingrédients"
  >

  <button
    class="target"
    id="carbs100"
    aria-label="Glucides pour 100 grammes">
  </button>

  <button
    class="target"
    id="carbsPortion"
    aria-label="Glucides par portion">
  </button>

  <button
    class="target"
    id="ingredients"
    aria-label="Liste des ingrédients">
  </button>

</div>

<div class="feedback" id="feedback"></div>

<button class="control" id="start">
Démarrer
</button>

<button class="control" id="replay">
Rejouer
</button>

<div id="result"></div>

</div>

<script>

let timeLeft = 30;
let timerInterval = null;
let started = false;

const foundTargets = new Set();

const timer = document.getElementById("timer");
const feedback = document.getElementById("feedback");
const result = document.getElementById("result");
const startButton = document.getElementById("start");
const replayButton = document.getElementById("replay");

function startGame() {

  clearInterval(timerInterval);

  timeLeft = 30;
  started = true;
  foundTargets.clear();

  timer.textContent = "30 s";

  feedback.textContent = "";
  feedback.className = "feedback";

  result.className = "";
  result.style.display = "none";
  result.innerHTML = "";

  startButton.style.display = "none";
  replayButton.style.display = "none";

  timerInterval = setInterval(() => {

    timeLeft--;

    timer.textContent = timeLeft + " s";

    if (timeLeft <= 0) {
      endGame(false);
    }

  }, 1000);
}

function targetPressed(id) {

  if (!started) return;

  if (foundTargets.has(id)) {
    return;
  }

  foundTargets.add(id);

  if (id === "carbs100") {
    feedback.textContent =
      "✅ Glucides pour 100 g trouvés : 68 g";
  }

  if (id === "carbsPortion") {
    feedback.textContent =
      "✅ Glucides par portion trouvés : 20,4 g";
  }

  if (id === "ingredients") {
    feedback.textContent =
      "✅ Liste des ingrédients trouvée";
  }

  feedback.className = "feedback correct";

  if (foundTargets.size === 3) {
    endGame(true);
  }
}

function endGame(success) {

  clearInterval(timerInterval);
  started = false;

  replayButton.style.display = "inline-block";

  if (success) {

    const elapsed = 30 - timeLeft;

    result.className = "success";

    result.innerHTML =
      "🎉 Bravo ! Tu as retrouvé les 3 informations en " +
      elapsed +
      " seconde" +
      (elapsed > 1 ? "s" : "") +
      " !";

  } else {

    timer.textContent = "0 s";

    result.className = "fail";

    result.innerHTML =
      "⏱️ Temps écoulé !<br><br>" +
      "<strong>Les réponses étaient :</strong><br>" +
      "Glucides pour 100 g : <strong>68 g</strong><br>" +
      "Glucides par portion : <strong>20,4 g</strong><br>" +
      "Liste des ingrédients : <strong>à droite du tableau nutritionnel</strong><br><br>" +
      "Observe l'emballage puis essaie à nouveau !";
  }
}

document
  .getElementById("carbs100")
  .addEventListener("click", () => {
    targetPressed("carbs100");
  });

document
  .getElementById("carbsPortion")
  .addEventListener("click", () => {
    targetPressed("carbsPortion");
  });

document
  .getElementById("ingredients")
  .addEventListener("click", () => {
    targetPressed("ingredients");
  });

startButton.addEventListener("click", startGame);
replayButton.addEventListener("click", startGame);

</script>

</body>
</html>
